version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: myfavgeo-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myfavgeo_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./myfavgeo-backend
    container_name: myfavgeo-backend
    env_file:
      - ./myfavgeo-backend/.env
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

    volumes:
      - ./myfavgeo-backend:/var/www
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./myfavgeo-frontend
    container_name: myfavgeo-frontend
    env_file:
      - ./myfavgeo-frontend/.env.docker
    volumes:
      - ./myfavgeo-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql-data: